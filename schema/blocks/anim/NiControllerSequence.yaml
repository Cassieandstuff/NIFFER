block: NiControllerSequence
inherits: NiObject
doc: >-
  An animation sequence. Every SSE instance (4,943) is 12 bytes, 29 per controlled block, then a
  38-byte tail. Field names follow what each slot holds across the corpus.
fields:
  - { name: name, type: stringref }
  - { name: numControlledBlocks, type: u32 }
  - { name: unknown0, type: u32, doc: "Always 1 in the corpus." }
  - name: controlledBlocks
    array: "count: numControlledBlocks"
    fields:
      - { name: interpolator, type: ref, to: [NiTransformInterpolator, NiFloatInterpolator, NiBoolInterpolator, NiPoint3Interpolator, NiBoolTimelineInterpolator, NiPathInterpolator] }
      - { name: controller, type: ptr, to: [NiTimeController] }
      - { name: unknown0, type: u8, doc: "Always 0 in the corpus." }
      - { name: nodeName, type: stringref, doc: "The name of a node in the file (63,607 of 63,644)." }
      - { name: propertyType, type: stringref, doc: "Empty, or a block class name." }
      - { name: controllerType, type: stringref, doc: "A controller class name." }
      - { name: variable, type: stringref, doc: "Empty, or a short numeric string." }
      - { name: parameter, type: stringref, doc: "Empty, or a parameter name such as BirthRate or EmitterActive." }
  - { name: unknown1, type: f32, doc: "Always 1.0 in the corpus." }
  - { name: textKeys, type: ref, to: [NiTextKeyExtraData] }
  - { name: unknown2, type: u32, doc: "2 or 0 in the corpus." }
  - { name: unknown3, type: f32, doc: "Always 1.0 in the corpus." }
  - { name: startTime, type: f32 }
  - { name: stopTime, type: f32, doc: "Never below startTime in the corpus." }
  - { name: manager, type: ptr, to: [NiControllerManager] }
  - { name: rootNodeName, type: stringref, doc: "A node's name (4,699 of 4,943)." }
  - { name: unknown4, type: u16, doc: "Always 0 in the corpus." }
