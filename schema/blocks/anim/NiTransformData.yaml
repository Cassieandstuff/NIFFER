block: NiTransformData
inherits: NiObject
doc: >-
  Rotation, translation and scale keys. Every NiTransformData in the SSE corpus (19,160) decodes
  exactly: rotation type 4 is three float key groups (X, Y, Z); types 1 and 3 are quaternion keys.
fields:
  - { name: numRotationKeys, type: u32 }
  - { name: rotationType, type: u32, if: { field: numRotationKeys, min: 1 } }
  - name: rotations
    if: { field: numRotationKeys, min: 1 }
    union:
      by: { field: rotationType }
      cases:
        - { when: 4, name: xyz, fields: [ { name: x, type: FloatKeyGroup }, { name: y, type: FloatKeyGroup }, { name: z, type: FloatKeyGroup } ] }
        - { when: [1, 3], name: quaternion, fields: [ { name: keys, type: "QuatKey[count: numRotationKeys]", packed: true } ] }
  - { name: translations, type: Vec3KeyGroup }
  - { name: scales, type: FloatKeyGroup }
