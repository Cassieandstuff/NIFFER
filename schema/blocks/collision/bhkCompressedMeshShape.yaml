block: bhkCompressedMeshShape
inherits: NiObject
doc: >-
  The first u32 is always 0 across the SSE corpus. Treated as an owning ref it made the block graph
  cyclic (block 0 is the root node), so it isn't one; whether it is a back pointer or a plain
  integer isn't established from the data alone.
fields:
  - { name: unknown0, type: u32 }
  - { name: data, type: bytes, doc: "The remaining Havok fields, raw." }
