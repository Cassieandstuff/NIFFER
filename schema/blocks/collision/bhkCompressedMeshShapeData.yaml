block: bhkCompressedMeshShapeData
inherits: NiObject
doc: >-
  Quantized triangle geometry (the data of a bhkCompressedMeshShape). Every one of the 8,214
  blocks in the SSE corpus decodes to exactly its size with this layout. Evidence per field is in
  docs/collision-provenance.md.
verified: ["clutter/barrel01.nif#2", "architecture/highhrothgar/hhdoor01.nif#18", "dlc01/dungeons/castle/exterior/casexttowerwall01.nif#2"]
fields:
  - { name: unknown0, type: u32, doc: Always 17. }
  - { name: unknown4, type: u32, doc: Always 18. }
  - { name: unknown8, type: u32, doc: Always 0x3FFFF. }
  - { name: unknown12, type: u32, doc: Always 0x1FFFF. }
  - { name: quantization, type: f32, doc: "Always 0.001: the step of the chunk vertices (vertex = chunk offset + q * quantization), which then lie inside boundsMin..boundsMax." }
  - { name: boundsMin, type: Vec4, doc: "w is 0 except in 10 blocks." }
  - { name: boundsMax, type: Vec4, doc: "w is 1.0 exactly when bigVertices is non-empty (309 blocks), else 0." }
  - { name: unknown52, type: u8, doc: Always 0. }
  - { name: unknown53, type: u8, doc: Always 1. }
  - { name: unknown54, type: u32, doc: Always 0. }
  - { name: unknown58, type: u32, doc: Always 0. }
  - { name: unknown62, type: u32, doc: Always 0. }
  - { name: materials, type: "CompressedMeshMaterial[count: u32]" }
  - { name: unknownCount, type: u32, doc: "Always 0; the layout of whatever it would count is unknown." }
  - { name: transforms, type: "CompressedMeshTransform[count: u32]" }
  - { name: bigVertices, type: "Vec4[count: u32]", packed: true, doc: "Unquantized vertices (w = 999.99994 where seen); all inside the bounds." }
  - { name: bigTriangles, type: "CompressedMeshBigTriangle[count: u32]", packed: true }
  - { name: chunks, type: "CompressedMeshChunk[count: u32]" }
  - { name: unknownTail, type: u32, doc: Always 0. }
