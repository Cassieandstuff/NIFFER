block: bhkRigidBody
inherits: bhkShapeWrapper
doc: >-
  250 bytes plus 4 per constraint in all 14,880 SSE bhkRigidBody/bhkRigidBodyT blocks (sizes 250,
  254, 262, 266). Evidence per field is in docs/collision-provenance.md.
verified: ["clutter/barrel01.nif#5"]
