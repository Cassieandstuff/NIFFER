block: bhkRigidBody
inherits: bhkShapeWrapper
doc: >-
  250 bytes plus 4 per constraint in all 14,880 SSE bhkRigidBody/bhkRigidBodyT blocks (sizes 250,
  254, 262, 266). After the shape link, bytes 4-243 are the 32-bit form of the game's
  bhkRigidBodyCinfo (0xF0 bytes: a 0x20-byte header, then Havok's hkpRigidBodyCinfo at +0x20), which
  the loader reads in one piece (CB-SDK bhkRigidBody::LoadBinary); the names below come from that map,
  and each is checked against the corpus. Evidence per field is in docs/collision-provenance.md.
verified: ["clutter/barrel01.nif#5"]
fields:
  - { name: collisionFilter, type: u32, doc: "The header's collision filter info. Byte 0 is the collision layer (the loader reads it as filter & 0x7F): in every block it is the index (BNAM) of one of Skyrim.esm's 55 COLL records, and the mesh folders match the record names (L_STATIC in architecture and dungeons, L_CLUTTER in clutter, L_WEAPON in weapons, L_BIPED in actors, L_TREES in landscape). Byte 1 takes 26 values (0-24 and 0x80-0x86), not established; bytes 2-3 are 0. Always equal to unknown36." }
  - { name: unknown8, type: u32, doc: "A header pointer as saved (varies per block like a 32-bit address, low nibble 0). Always equal to unknown40." }
  - { name: unknown12, type: u8, doc: Always 1 (2 in bhkSimpleShapePhantom). }
  - { name: unknown13, type: "u8[3]", doc: "Padding (uninitialized-looking)." }
  - { name: unknown16, type: "u32[3]", doc: "An empty array as saved: always 0, 0, 0x80000000." }
  - { name: unknown28, type: u32, doc: "Byte 0 is always 1 and bytes 2-3 always 0xFFFF." }
  - { name: unknown32, type: u32, doc: "Padding before hkpRigidBodyCinfo." }
  - { name: unknown36, type: u32, doc: "hkpRigidBodyCinfo's collision filter info. Always equal to collisionFilter." }
  - { name: unknown40, type: u32, doc: "hkpRigidBodyCinfo's shape pointer as saved. Always equal to unknown8." }
  - { name: unknown44, type: u32, doc: "hkpRigidBodyCinfo's local-frame pointer: always 0." }
  - { name: collisionResponse, type: u8, doc: "Always 1 (simple contact)." }
  - { name: unknown49, type: u8, doc: "Padding." }
  - { name: contactPointCallbackDelay, type: u16, doc: "0xFFFF in 14,868 blocks." }
  - { name: translation, type: Vec4, doc: "w = 0 in 14,871 of 14,880." }
  - { name: rotation, type: Vec4, doc: "Unit quaternion x, y, z, w (|q| = 1 in every block)." }
  - { name: linearVelocity, type: Vec4, doc: Always zero. }
  - { name: angularVelocity, type: Vec4, doc: Always zero. }
  - { name: inertia, type: "Vec4[3]", doc: "A symmetric 3x3 matrix (w = 0). For bodies with a bhkSphereShape it is diag(0.4 m r^2) in most of them." }
  - { name: centerOfMass, type: Vec4 }
  - { name: mass, type: f32, doc: "0 exactly when inertia is all zero (14,868 of 14,880)." }
  - { name: linearDamping, type: f32, doc: "0.0996 (0.1 as stored) in 14,631 bodies; also 0.0498, 0.598, 0." }
  - { name: angularDamping, type: f32, doc: "0.0498 (0.05 as stored) in 14,723 bodies; also 2, 0, 0.5, 1, 0.25." }
  - { name: timeFactor, type: f32, doc: Always 1.0. }
  - { name: gravityFactor, type: f32, doc: Always 1.0. }
  - { name: friction, type: f32, doc: "0.5 in 12,995 bodies, 0.3 in 1,819; 16 distinct values from 0 to 100." }
  - { name: rollingFrictionMultiplier, type: f32, doc: Always 0. }
  - { name: restitution, type: f32, doc: "0.4 in 12,947 bodies, 0.8 in 1,847; 7 distinct values from 0.2 to 0.9." }
  - { name: maxLinearVelocity, type: f32, doc: "104.4 in 13,794 bodies; 1000002 in exactly the 1,087 keyframed bodies with no mass. The loader clamps it to 100." }
  - { name: maxAngularVelocity, type: f32, doc: "31.57 in 13,617 bodies, 1000002 in 1,229 (fixed or keyframed), 1068 in 35." }
  - { name: allowedPenetrationDepth, type: f32, doc: "0.002 to 0.15; 0.1 in 6,723 bodies, 0.15 in 3,367." }
  - { name: motionType, type: u8, doc: "Havok's motion type, 2-5 in the corpus: 2 sphere inertia and 3 box inertia (mass never 0: 3,010 of 3,010), 4 keyframed (with mass 0, 1,073 of 1,087 are in files with a controller or interpolator; with mass, 1,193 of 1,275 hang off a bhkBlendCollisionObject), 5 fixed (mass 0 in 9,460 of 9,510). The loader makes a body of no mass fixed unless its layer is 2 or 28, and keyframed if its layer is 14 or 29." }
  - { name: enableDeactivation, type: u8, doc: Always 1. }
  - { name: solverDeactivation, type: u8, doc: "1 (off) or 2 (low)." }
  - { name: qualityType, type: u8, doc: "Havok's collidable quality: 0 fixed, 1 keyframed, 2 debris, 4 moving in the corpus." }
  - { name: autoRemoveLevel, type: u8, doc: Always 0. }
  - { name: responseModifierFlags, type: u8, doc: Always 0. }
  - { name: numShapeKeysInContactPointProperties, type: u8, doc: Always 3. }
  - { name: forceCollideOntoPpu, type: u8, doc: Always 0. }
  - { name: unknown232, type: "u32[3]", doc: "Padding to hkpRigidBodyCinfo's 16-byte size (uninitialized-looking)." }
  - { name: constraints, type: "ref[count: u32]", to: [bhkConstraint, bhkBallSocketConstraintChain], doc: "Every constraint block in the corpus is referenced from exactly one rigid body's list." }
  - { name: unknownTail, type: u16, doc: "The body's flags as the loader reads them (bit 6 is read as the body following its node); 0 except in one block (1)." }
