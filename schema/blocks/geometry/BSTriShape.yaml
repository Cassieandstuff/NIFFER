block: BSTriShape
inherits: NiAVObject
doc: >-
  Confirmed against clutter/barrel01.nif block 7.
verified: ["clutter/barrel01.nif#7"]
fields:
  - { name: boundCenter, type: Vec3 }
  - { name: boundRadius, type: f32 }
