block: NiTriShape
inherits: NiAVObject
doc: >-
  A legacy shape: its data, a skin ref (always null in the corpus), 9 bytes, then shader and alpha
  properties. All 243 SSE instances (and BSLODTriShape's 43).
fields:
  - { name: data, type: ref, to: [NiTriShapeData] }
  - { name: skin, type: ref }
  - { name: unknown0, type: bytes, size: 9, doc: "Always zero in the corpus." }
  - { name: shaderProperty, type: ref, to: [BSLightingShaderProperty, BSEffectShaderProperty] }
  - { name: alphaProperty, type: ref, to: [NiAlphaProperty] }
