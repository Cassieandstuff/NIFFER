block: NiPSysData
inherits: NiObject
doc: >-
  Particle-system data. All 1,547 SSE instances are a 51-byte head, a u32 count of Vec4 rectangles
  (every component within [0, 1]: sub-texture UV rectangles), and a 19-byte tail. Its head has a
  bounding sphere at the same offset as legacy geometry's (radius never negative), but none of
  the per-particle arrays are stored. Words without an established meaning are unknownN.
fields:
  - { name: unknown0, type: u32, doc: "Always 0 in the corpus." }
  - { name: unknown1, type: u16, doc: "A count-like value (40, 50, 62...); doesn't affect the layout." }
  - { name: unknown2, type: u16, doc: "Always 0 in the corpus." }
  - { name: unknown3, type: "u8[3]", doc: "Always 1, 0, 0 in the corpus." }
  - { name: unknown4, type: u32, doc: "Always 0 in the corpus." }
  - { name: unknown5, type: u8, doc: "Always 0 in the corpus." }
  - { name: boundCenter, type: Vec3 }
  - { name: boundRadius, type: f32 }
  - { name: unknown6, type: u8, doc: "1 or 0." }
  - { name: unknown7, type: u16, doc: "Always 0 in the corpus." }
  - { name: unknown8, type: i32, doc: "Always -1 in the corpus." }
  - { name: unknown9, type: "u8[8]", doc: "1, 0, 0, 1, 0, (0|1), 0, (0|1) in the corpus." }
  - { name: numUvRects, type: u32 }
  - { name: uvRects, type: "Vec4[count: numUvRects]", packed: true }
  - { name: unknown10, type: f32 }
  - { name: unknown11, type: u8 }
  - { name: unknown12, type: u8 }
  - { name: unknown13, type: f32 }
  - { name: unknown14, type: f32 }
  - { name: unknown15, type: f32 }
  - { name: unknown16, type: u8 }
