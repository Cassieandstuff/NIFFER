block: NiPSysPlanarCollider
inherits: NiObject
doc: >-
  A float and two bytes, then the spawn modifier, the owning collider manager, the next collider
  in the chain (or null), a scene node, and 32 bytes of shape data. All 96 SSE instances.
fields:
  - { name: unknown0, type: f32 }
  - { name: unknown1, type: "u8[2]" }
  - { name: spawnModifier, type: ptr, to: [NiPSysSpawnModifier] }
  - { name: manager, type: ptr, to: [NiPSysColliderManager] }
  - { name: nextCollider, type: ref, to: [NiPSysPlanarCollider, NiPSysSphericalCollider] }
  - { name: node, type: ptr, to: [NiNode] }
  - { name: shapeData, type: bytes, size: 32, doc: "Not yet decoded." }
