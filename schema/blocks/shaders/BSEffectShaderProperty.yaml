block: BSEffectShaderProperty
inherits: NiObjectNET
doc: >-
  The effect (unlit) shader. All 8,362 SSE instances parse exactly. The flags and UV fields sit
  where BSLightingShaderProperty's do; both strings are .dds paths or empty.
fields:
  - { name: shaderFlags1, type: u32 }
  - { name: shaderFlags2, type: u32 }
  - { name: uvOffset, type: Vec2 }
  - { name: uvScale, type: Vec2 }
  - { name: texture, type: sizedstring, doc: "A .dds path, or empty." }
  - { name: unknown0, type: u8, doc: "3, 2 or 0 in the corpus." }
  - { name: unknown1, type: u8, doc: "0-255; 255 in most blocks." }
  - { name: unknown2, type: u8, doc: "Always 0 in the corpus." }
  - { name: unknown3, type: u8, doc: "Always 0 in the corpus." }
  - { name: unknownFloats, type: "f32[10]", doc: "Mostly within [0, 1]; the last is often 100." }
  - { name: texture2, type: sizedstring, doc: "A .dds path, or empty." }
