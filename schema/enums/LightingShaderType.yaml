enum: LightingShaderType
source: "CommonLibSSE-NG 4.15.0 (530bbc73e514251ce96be899375d59f6ccd9fe9f), RE::BSShaderMaterial::Feature"
doc: >-
  BSLightingShaderProperty's shaderType: the lighting material's feature, which also chooses the material tail's
  layout. Named from CommonLibSSE-NG's material feature enum, taken to be the stored value: UNVERIFIED against the
  exe except where a value's doc says so. The SSE corpus holds 0-6, 11, 14 and 16.
values:
  - { name: default, value: 0 }
  - { name: environmentMap, value: 1 }
  - { name: glowMap, value: 2 }
  - { name: parallax, value: 3 }
  - { name: faceGen, value: 4, doc: "BK's Model.cpp reads 4 as facegen, the same." }
  - { name: faceGenRGBTint, value: 5, doc: "BK's Model.cpp reads 5 as a skin tint, the same." }
  - { name: hairTint, value: 6, doc: "BK's Model.cpp reads 6 as a hair tint, the same." }
  - { name: parallaxOcc, value: 7, doc: "not in the SSE corpus." }
  - { name: multiTexLand, value: 8, doc: "not in the SSE corpus." }
  - { name: lodLand, value: 9, doc: "not in the SSE corpus." }
  - { name: unknown, value: 10, doc: "not in the SSE corpus." }
  - { name: multilayerParallax, value: 11 }
  - { name: treeAnim, value: 12, doc: "not in the SSE corpus." }
  - { name: multiIndexTriShapeSnow, value: 14 }
  - { name: lodObjectsHD, value: 15, doc: "not in the SSE corpus." }
  - { name: eye, value: 16 }
  - { name: cloud, value: 17, doc: "not in the SSE corpus." }
  - { name: lodLandNoise, value: 18, doc: "not in the SSE corpus." }
  - { name: multiTexLandLODBlend, value: 19, doc: "not in the SSE corpus." }
