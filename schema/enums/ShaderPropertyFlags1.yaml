enum: ShaderPropertyFlags1
flags: true
source: "CommonLibSSE-NG 4.15.0 (530bbc73e514251ce96be899375d59f6ccd9fe9f), RE::BSShaderProperty::EShaderPropertyFlag, bits 0-31 (stored bit n = enum bit 0+n)"
doc: >-
  The shader property's first flags word as a NIF stores it (SLSF1). Named from CommonLibSSE-NG's
  runtime flag enum, whose low and high 32 bits these two stored words are taken to be: UNVERIFIED against the exe
  except where a value's doc says a first-party reader agrees (docs/naming.md, 'Shader flags').
