struct: KeyGroup
doc: >-
  An animation key group. Confirmed against glazedcandles (NiFloatData, quadratic 16-byte keys), nocturnal (NiBoolData, constant 5-byte keys) and ashpile (NiPosData, quadratic 40-byte keys).
fields:
  - { name: numKeys, type: u32 }
  - { name: interpolation, type: u32, if: { field: numKeys, min: 1 }, doc: The key type; present only when there are keys. }
  - { name: keys, type: bytes, doc: "The keys, raw. Their size depends on the key type and the channel, so they are decoded by a later language version (unions)." }
